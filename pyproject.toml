[project]
name = "asr-bench"
version = "0.1.0"
description = "Local, reproducible ASR and speaker diarization comparisons"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "nemo-toolkit[asr]",
  "huggingface-hub>=0.34,<2",
  "imageio-ffmpeg>=0.6,<1",
  "soundfile>=0.13,<1",
  "jiwer>=4,<5",
  "pythainlp>=5,<6",
  "scipy>=1.15,<2",
  "psutil>=7,<8",
  "pydantic>=2,<3",
  "typer>=0.15,<1",
  "rich>=13,<15",
  "qwen-asr==0.0.6",
]

[project.scripts]
asr-bench = "asr_bench.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
nemo-toolkit = { git = "https://github.com/NVIDIA-NeMo/Speech.git", rev = "205cb6ae0beb5b51c5b279d951baa682a37e7069" }

[tool.ruff]
line-length = 119

[tool.pytest.ini_options]
testpaths = ["tests"]
